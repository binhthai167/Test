{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kết quả bài kiểm tra</title>
    <link rel="stylesheet" type="text/css" href="{% static 'polls/result.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="result-container">
    <h2 class="result-title">🎉 Hoàn thành</h2>
    <div class="score-box">
        <span>{{username}}, </span>
        <span>Chúng tôi đã nhận được câu trả lời của bạn</span>
       <!-- <span>Kết quả: <strong>{% if passed %}passed{% else %}failed{% endif %}</strong></span> -->
    </div>
</div>
<script>
    // Ngăn sử dụng nút Back
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
        history.go(1); // Ép trình duyệt quay lại trang hiện tại
    };
</script>
</body>
</html>
